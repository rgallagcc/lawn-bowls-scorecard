<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lawn Bowls – Advanced Scorecard</title>

<style>

/* ================= ROOT VARIABLES ================= */

:root {

    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #222;
    --border: #d0d0d0;

    --primary: #2f7d32;
    --primary-hover: #256428;

    --table-head: #e8e8e8;

    --shadow: rgba(0,0,0,0.08);
}

/* ================= THEMES ================= */

body.light-theme {

    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #222;
    --border: #d0d0d0;

    --primary: #2f7d32;
    --primary-hover: #256428;

    --table-head: #e8e8e8;
}

body.dark-theme {

    --bg: #121212;
    --card: #1e1e1e;
    --text: #f0f0f0;
    --border: #444;

    --primary: #4caf50;
    --primary-hover: #43a047;

    --table-head: #2b2b2b;
}

body.paper-theme {

    --bg: #f7f1e3;
    --card: #fffdf7;
    --text: #4b3f2f;
    --border: #d8cbb8;

    --primary: #8b5e34;
    --primary-hover: #6f4724;

    --table-head: #ede2d0;

    font-family: Georgia, serif;
}

body.future-theme {

    --bg: #050816;
    --card: #111827;
    --text: #d7f9ff;
    --border: #00e5ff;

    --primary: #00e5ff;
    --primary-hover: #00bcd4;

    --table-head: #09111f;

    background:
        radial-gradient(circle at top, #0f172a, #020617);
}

/* ================= GLOBAL ================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 12px;

    background: var(--bg);
    color: var(--text);

    font-family: Arial, sans-serif;

    transition: 0.3s;
}

h1, h2, h3 {

    margin-top: 0;
}

/* ================= THEME SWITCHER ================= */

.theme-switcher {

    margin-bottom: 15px;
}

.theme-switcher select {

    width: 100%;
}

/* ================= CARDS ================= */

.card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 15px;

    margin-bottom: 15px;

    box-shadow:
        0 4px 10px var(--shadow);
}

/* ================= FORMS ================= */

label {

    display: block;

    margin-top: 10px;
}

input,
textarea,
select {

    width: 100%;

    padding: 12px;

    margin-top: 5px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    font-size: 16px;
}

/* ================= BUTTONS ================= */

button {

    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border: none;

    border-radius: 10px;

    background: var(--primary);

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: var(--primary-hover);
}

/* ================= TABLES ================= */

table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 10px;
}

th,
td {

    border: 1px solid var(--border);

    padding: 8px;

    text-align: center;
}

th {

    background: var(--table-head);
}

/* ================= MOBILE TABLES ================= */

@media (max-width: 768px) {

    table,
    thead,
    tbody,
    th,
    td,
    tr {

        display: block;
    }

    thead {

        display: none;
    }

    tr {

        margin-bottom: 15px;

        border: 1px solid var(--border);

        border-radius: 12px;

        overflow: hidden;

        background: var(--card);
    }

    td {

        display: flex;

        justify-content: space-between;

        align-items: center;

        text-align: right;

        padding: 12px;

        border: none;

        border-bottom: 1px solid var(--border);

        gap: 10px;
    }

    td:last-child {

        border-bottom: none;
    }

    td::before {

        content: attr(data-label);

        font-weight: bold;

        text-align: left;
    }

    .actions {

        display: flex;

        flex-wrap: wrap;

        gap: 5px;

        justify-content: flex-end;
    }

    .actions button {

        width: auto;

        margin: 0;

        padding: 8px 10px;
    }
}

/* ================= RESULTS ================= */

.win {

    background: rgba(76,175,80,0.15);
}

.loss {

    background: rgba(244,67,54,0.15);
}

.draw {

    background: rgba(255,193,7,0.15);
}

/* ================= MODAL ================= */

#matchModal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.7);

    overflow-y: auto;

    padding: 10px;

    z-index: 999;
}

.modal-box {

    background: var(--card);

    color: var(--text);

    border-radius: 16px;

    padding: 15px;

    width: 100%;
    max-width: 900px;

    margin: 20px auto;

    position: relative;
}

.close-btn {

    position: absolute;

    top: 10px;
    right: 10px;

    width: auto;
}

/* ================= DESKTOP ================= */

@media (min-width: 769px) {

    button {

        width: auto;
    }

    input,
    textarea,
    select {

        max-width: 450px;
    }

    .theme-switcher select {

        width: 250px;
    }
}

</style>

</head>

<body class="light-theme">

<!-- ================= THEME ================= -->

<div class="theme-switcher">

<select
    id="themeSelector"
    onchange="changeTheme(this.value)"
>

<option value="light-theme">
Light Theme
</option>

<option value="dark-theme">
Dark Theme
</option>

<option value="paper-theme">
Paper Theme
</option>

<option value="future-theme">
Futuristic Theme
</option>

</select>

</div>

<h1>🏏 Lawn Bowls – Advanced Scorecard</h1>

<!-- ================= MATCH FORM ================= -->

<div class="card">

<h2>Add Match</h2>

<label>
Date
<input type="date" id="date">
</label>

<label>
Team A
<input id="teamA">
</label>

<label>
Team B
<input id="teamB">
</label>

<h3>Ends</h3>

<table id="endsTable">

<thead>

<tr>
<th>End</th>
<th>Team A</th>
<th>Team B</th>
<th>Remove</th>
</tr>

</thead>

<tbody></tbody>

</table>

<button onclick="addEnd()">
Add End
</button>

<label>
Notes
<textarea id="notes"></textarea>
</label>

<button onclick="saveMatch()">
Save Match
</button>

</div>

<!-- ================= HISTORY ================= -->

<div class="card">

<h2>Match History</h2>

<table>

<thead>

<tr>
<th>Date</th>
<th>Team A</th>
<th>Score</th>
<th>Team B</th>
<th>Score</th>
<th>Winner</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="matchHistory"></tbody>

</table>

</div>

<!-- ================= MODAL ================= -->

<div id="matchModal">

<div class="modal-box">

<button
    class="close-btn"
    onclick="closeModal()"
>
✖
</button>

<div id="modalContent"></div>

</div>

</div>

<script>

/* ================= THEME ================= */

function changeTheme(theme) {

    document.body.className = theme;

    localStorage.setItem(
        "selectedTheme",
        theme
    );
}

function loadTheme() {

    const saved =
        localStorage.getItem("selectedTheme")
        || "light-theme";

    document.body.className = saved;

    themeSelector.value = saved;
}

loadTheme();

/* ================= STORAGE ================= */

let matches =
    JSON.parse(
        localStorage.getItem("matches")
    ) || [];

/* ================= ADD END ================= */

function addEnd(a = 0, b = 0) {

    const tbody =
        document.querySelector(
            "#endsTable tbody"
        );

    const row =
        document.createElement("tr");

    row.innerHTML = `

        <td data-label="End">
            ${tbody.rows.length + 1}
        </td>

        <td data-label="Team A">

            <input
                type="number"
                min="0"
                value="${a}"
            >

        </td>

        <td data-label="Team B">

            <input
                type="number"
                min="0"
                value="${b}"
            >

        </td>

        <td data-label="Remove">

            <button onclick="removeEnd(this)">
                ❌
            </button>

        </td>
    `;

    tbody.appendChild(row);
}

/* ================= REMOVE END ================= */

function removeEnd(button) {

    button.closest("tr").remove();

    renumberEnds();
}

/* ================= RENUMBER ================= */

function renumberEnds() {

    [...document.querySelectorAll(
        "#endsTable tbody tr"
    )].forEach((row, index) => {

        row.children[0].innerHTML =
            index + 1;
    });
}

/* ================= SAVE MATCH ================= */

function saveMatch() {

    if (
        !date.value ||
        !teamA.value.trim() ||
        !teamB.value.trim()
    ) {

        alert(
            "Please complete all fields."
        );

        return;
    }

    const ends =
        [...document.querySelectorAll(
            "#endsTable tbody tr"
        )].map(row => ({

            a: Number(
                row.children[1]
                .querySelector("input").value
            ),

            b: Number(
                row.children[2]
                .querySelector("input").value
            )
        }));

    const match = {

        id: Date.now(),

        date: date.value,

        teamA: teamA.value.trim(),

        teamB: teamB.value.trim(),

        ends,

        notes: notes.value.trim()
    };

    matches.push(match);

    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );

    render();

    clearForm();
}

/* ================= TOTAL ================= */

function total(match, side) {

    return match.ends.reduce(
        (sum, end) =>
            sum + Number(end[side]),
        0
    );
}

/* ================= RENDER ================= */

function render() {

    matchHistory.innerHTML = "";

    matches.forEach(m => {

        const a =
            total(m, "a");

        const b =
            total(m, "b");

        let winner = "Draw";
        let rowClass = "draw";

        if (a > b) {

            winner = m.teamA;

            rowClass = "win";
        }

        else if (b > a) {

            winner = m.teamB;

            rowClass = "loss";
        }

        const row =
            document.createElement("tr");

        row.className = rowClass;

        row.innerHTML = `

            <td data-label="Date">
                ${m.date}
            </td>

            <td data-label="Team A">
                ${m.teamA}
            </td>

            <td data-label="Score A">
                ${a}
            </td>

            <td data-label="Team B">
                ${m.teamB}
            </td>

            <td data-label="Score B">
                ${b}
            </td>

            <td data-label="Winner">
                ${winner}
            </td>

            <td
                data-label="Actions"
                class="actions"
            >

                <button onclick="viewMatch(${m.id})">
                    👁
                </button>

                <button onclick="deleteMatch(${m.id})">
                    🗑
                </button>

            </td>
        `;

        matchHistory.appendChild(row);
    });
}

/* ================= VIEW MATCH ================= */

function viewMatch(id) {

    const match =
        matches.find(m => m.id == id);

    if (!match) return;

    const a =
        total(match, "a");

    const b =
        total(match, "b");

    modalContent.innerHTML = `

        <h2>
            ${match.teamA}
            vs
            ${match.teamB}
        </h2>

        <p>
            <b>Date:</b>
            ${match.date}
        </p>

        <p>
            <b>Final Score:</b>
            ${a} - ${b}
        </p>

        <h3>Notes</h3>

        <p>
            ${match.notes || "No notes."}
        </p>
    `;

    matchModal.style.display =
        "block";
}

/* ================= CLOSE MODAL ================= */

function closeModal() {

    matchModal.style.display =
        "none";
}

/* ================= DELETE ================= */

function deleteMatch(id) {

    if (
        !confirm("Delete match?")
    ) return;

    matches =
        matches.filter(
            m => m.id != id
        );

    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );

    render();
}

/* ================= CLEAR FORM ================= */

function clearForm() {

    date.value = "";
    teamA.value = "";
    teamB.value = "";
    notes.value = "";

    document.querySelector(
        "#endsTable tbody"
    ).innerHTML = "";

    addEnd();
}

/* ================= INIT ================= */

clearForm();

render();

</script>

</body>
</html>
