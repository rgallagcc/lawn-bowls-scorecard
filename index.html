<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lawn Bowls – Advanced Scorecard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 20px;
}

h1,h2,h3 {
    margin-bottom: 5px;
}

.card {
    background: #fff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

label {
    display: block;
    margin-top: 8px;
}

input, textarea, select {
    padding: 6px;
    width: 250px;
}

button {
    margin-top: 10px;
    padding: 6px 12px;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
}

th {
    background: #e0e0e0;
}

.small {
    width: 70px;
}

.notice {
    text-align: center;
    font-style: italic;
    color: #555;
}

.actions button {
    margin: 2px;
}

.win {
    background: #d4edda;
}

.loss {
    background: #f8d7da;
}

.draw {
    background: #fff3cd;
}

#matchModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    overflow: auto;
    z-index: 1000;
}

.modal-box {
    background: white;
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 10px;
    position: relative;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
}

</style>
</head>

<body>

<h1>🏏 Lawn Bowls – Advanced Scorecard</h1>

<!-- ================= ADD / EDIT MATCH ================= -->

<div class="card">

<h2>Add / Edit Match</h2>

<input type="hidden" id="editingId">

<label>
Date
<input type="date" id="date">
</label>

<!-- ================= TEAM FORMAT ================= -->

<h3>Team Format / Size</h3>

<label>

<select id="teamFormat" onchange="updatePlayerFields()">

    <option value="singles">
        Singles (1 Player)
    </option>

    <option value="pairs">
        Pairs (2 Players)
    </option>

    <option value="triples">
        Triples (3 Players)
    </option>

    <option value="fours" selected>
        Fours / Rinks (4 Players)
    </option>

</select>

</label>

<!-- ================= TEAM A ================= -->

<h3>Team A</h3>

<label>
Team Name
<input id="teamA">
</label>

<div id="teamAPlayers"></div>

<!-- ================= TEAM B ================= -->

<h3>Team B</h3>

<label>
Team Name
<input id="teamB">
</label>

<div id="teamBPlayers"></div>

<!-- ================= ENDS ================= -->

<h3>Ends</h3>

<table id="endsTable">

<thead>
<tr>
<th>End</th>
<th>Team A</th>
<th>Team B</th>
<th>Remove</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button onclick="addEnd()">Add End</button>

<label>
Match Notes
<textarea id="notes" rows="3"></textarea>
</label>

<br>

<button onclick="saveMatch()">Save Match</button>

</div>

<!-- ================= FILTERS ================= -->

<div class="card">

<h2>Filters</h2>

<label>
Filter by Team
<input id="filterTeam" oninput="render()">
</label>

<label>
From Date
<input type="date" id="fromDate" onchange="render()">
</label>

<label>
To Date
<input type="date" id="toDate" onchange="render()">
</label>

</div>

<!-- ================= HISTORY ================= -->

<div class="card">

<h2>Match History</h2>

<table>

<thead>
<tr>
<th>Date</th>
<th>Team A</th>
<th>Score</th>
<th>Team B</th>
<th>Score</th>
<th>Winner</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="matchHistory"></tbody>

</table>

</div>

<!-- ================= STATS ================= -->

<div class="card">

<h2>Statistics</h2>

<div id="stats"></div>

</div>

<!-- ================= IMPORT / EXPORT ================= -->

<div class="card">

<h2>Import / Export</h2>

<button onclick="exportJSON()">Export JSON</button>

<button onclick="exportCSV()">Export CSV</button>

<input type="file" accept=".json" onchange="importJSON(event)">

<button onclick="clearAll()">Clear All</button>

<p id="lastSaved"></p>

</div>

<!-- ================= MATCH DETAILS MODAL ================= -->

<div id="matchModal">

    <div class="modal-box">

        <button
            class="close-btn"
            onclick="closeModal()"
        >
            ✖
        </button>

        <div id="modalContent"></div>

    </div>

</div>

<script>

/* ================= ELEMENT REFERENCES ================= */

const historyTable =
    document.getElementById("matchHistory");

/* ================= STORAGE ================= */

let matches = [];

loadStorage();

/* ================= LOAD STORAGE ================= */

function loadStorage() {

    try {

        const saved =
            JSON.parse(localStorage.getItem("matches"));

        if (Array.isArray(saved)) {

            matches = saved;

        }

    }

    catch (err) {

        console.error("Storage load failed", err);

        matches = [];
    }
}

/* ================= SAVE STORAGE ================= */

function saveStorage() {

    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );

    lastSaved.innerHTML =
        "Last saved: " +
        new Date().toLocaleString();
}

/* ================= TEAM FORMAT ================= */

function updatePlayerFields() {

    const format = teamFormat.value;

    let roles = [];

    switch (format) {

        case "singles":
            roles = ["Single"];
            break;

        case "pairs":
            roles = ["Lead", "Skip"];
            break;

        case "triples":
            roles = ["Lead", "Second", "Skip"];
            break;

        case "fours":
        default:
            roles = ["Lead", "Second", "Third", "Skip"];
            break;
    }

    renderPlayerInputs("teamAPlayers", "a", roles);

    renderPlayerInputs("teamBPlayers", "b", roles);
}

function renderPlayerInputs(containerId, prefix, roles) {

    const container =
        document.getElementById(containerId);

    container.innerHTML = "";

    roles.forEach(role => {

        const safeRole =
            role.toLowerCase();

        container.innerHTML += `
            <label>
                ${role}
                <input id="${prefix}${safeRole}">
            </label>
        `;
    });
}

function getPlayers(prefix) {

    const inputs =
        document.querySelectorAll(
            `#team${prefix.toUpperCase()}Players input`
        );

    const players = {};

    inputs.forEach(input => {

        players[input.id.replace(prefix, "")] =
            input.value.trim();

    });

    return players;
}

/* ================= END MANAGEMENT ================= */

function addEnd(a = 0, b = 0) {

    const tbody = endsTable.tBodies[0];

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${tbody.rows.length + 1}</td>

        <td>
            <input class="small" type="number" min="0" value="${a}">
        </td>

        <td>
            <input class="small" type="number" min="0" value="${b}">
        </td>

        <td>
            <button onclick="removeEnd(this)">❌</button>
        </td>
    `;

    tbody.appendChild(row);
}

function removeEnd(button) {

    button.closest("tr").remove();

    renumberEnds();
}

function renumberEnds() {

    [...endsTable.tBodies[0].rows].forEach((row, index) => {

        row.cells[0].innerText = index + 1;

    });
}

/* ================= TOTALS ================= */

function total(match, side) {

    if (!match.ends || !Array.isArray(match.ends)) {

        return 0;
    }

    return match.ends.reduce((sum, end) => {

        const value =
            side === "a"
            ? Number(end.a || 0)
            : Number(end.b || 0);

        return sum + value;

    }, 0);
}

/* ================= SAVE MATCH ================= */

function saveMatch() {

    if (
        !date.value ||
        !teamA.value.trim() ||
        !teamB.value.trim()
    ) {

        alert("Please enter a date and both team names.");

        return;
    }

    const ends =
        [...endsTable.tBodies[0].rows].map(r => ({

            a: Number(
                r.cells[1].firstElementChild.value || 0
            ),

            b: Number(
                r.cells[2].firstElementChild.value || 0
            )

        }));

    if (ends.length === 0) {

        alert("Please add at least one end.");

        return;
    }

    const id =
        editingId.value || Date.now().toString();

    const match = {

        id,

        date: date.value,

        format: teamFormat.value,

        teamA: {

            name: teamA.value.trim(),

            players: getPlayers("a")
        },

        teamB: {

            name: teamB.value.trim(),

            players: getPlayers("b")
        },

        ends,

        notes: notes.value.trim(),

        created: new Date().toISOString()
    };

    matches =
        matches.filter(
            m => String(m.id) !== String(id)
        );

    matches.push(match);

    matches.sort((a, b) =>
        new Date(b.date) - new Date(a.date)
    );

    saveStorage();

    clearForm();

    render();
}

/* ================= RENDER ================= */

function render() {

    historyTable.innerHTML = "";

    let rowsRendered = 0;

    let wins = 0;
    let losses = 0;
    let draws = 0;

    let shotsFor = 0;
    let shotsAgainst = 0;

    const teamFilter =
        (filterTeam.value || "").toLowerCase();

    matches.forEach(m => {

        if (
            !m ||
            !m.teamA ||
            !m.teamB ||
            !Array.isArray(m.ends)
        ) {
            return;
        }

        const teamAName =
            m.teamA.name || "Unknown";

        const teamBName =
            m.teamB.name || "Unknown";

        if (
            teamFilter &&
            !teamAName.toLowerCase().includes(teamFilter) &&
            !teamBName.toLowerCase().includes(teamFilter)
        ) {
            return;
        }

        if (
            fromDate.value &&
            new Date(m.date) < new Date(fromDate.value)
        ) {
            return;
        }

        if (
            toDate.value &&
            new Date(m.date) > new Date(toDate.value)
        ) {
            return;
        }

        const a = total(m, "a");
        const b = total(m, "b");

        shotsFor += a;
        shotsAgainst += b;

        let winner = "Draw";
        let rowClass = "draw";

        if (a > b) {

            winner = teamAName;
            wins++;
            rowClass = "win";
        }

        else if (b > a) {

            winner = teamBName;
            losses++;
            rowClass = "loss";
        }

        else {

            draws++;
        }

        const row = document.createElement("tr");

        row.className = rowClass;

        row.innerHTML = `
            <td>${m.date || "-"}</td>

            <td>${teamAName}</td>

            <td>${a}</td>

            <td>${teamBName}</td>

            <td>${b}</td>

            <td>${winner}</td>

            <td class="actions">

                <button onclick="viewMatch('${m.id}')">
                    👁
                </button>

                <button onclick="loadMatch('${m.id}')">
                    ✏
                </button>

                <button onclick="deleteMatch('${m.id}')">
                    🗑
                </button>

            </td>
        `;

        historyTable.appendChild(row);

        rowsRendered++;
    });

    if (rowsRendered === 0) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td colspan="7" class="notice">
                No matches match the current filters.
            </td>
        `;

        historyTable.appendChild(row);
    }

    stats.innerHTML = `
        <b>Results</b><br>

        Wins: ${wins} |
        Losses: ${losses} |
        Draws: ${draws}

        <br><br>

        <b>Shots</b><br>

        Shots For: ${shotsFor} |
        Shots Against: ${shotsAgainst} |
        Difference: ${shotsFor - shotsAgainst}

        <br><br>

        <b>Total Matches:</b> ${rowsRendered}
    `;
}

/* ================= VIEW MATCH ================= */

function viewMatch(id) {

    const m =
        matches.find(
            x => String(x.id) === String(id)
        );

    if (!m) return;

    const a = total(m, "a");
    const b = total(m, "b");

    let winner = "Draw";

    if (a > b) winner = m.teamA.name;
    else if (b > a) winner = m.teamB.name;

    function renderPlayers(team) {

        let html = "";

        Object.entries(team.players || {})
        .forEach(([role, name]) => {

            html += `
                <li>
                    <b>${capitalize(role)}</b>:
                    ${name || "-"}
                </li>
            `;
        });

        return html;
    }

    let endsHTML = `
        <table style="width:100%; border-collapse:collapse; margin-top:10px;">
            <thead>
                <tr>
                    <th>End</th>
                    <th>${m.teamA.name}</th>
                    <th>${m.teamB.name}</th>
                </tr>
            </thead>
            <tbody>
    `;

    m.ends.forEach((e, index) => {

        endsHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${e.a}</td>
                <td>${e.b}</td>
            </tr>
        `;
    });

    endsHTML += `
            </tbody>
        </table>
    `;

    modalContent.innerHTML = `

        <h2>
            ${m.teamA.name}
            vs
            ${m.teamB.name}
        </h2>

        <p>
            <b>Date:</b>
            ${m.date}
        </p>

        <p>
            <b>Format:</b>
            ${capitalize(m.format || "fours")}
        </p>

        <p>
            <b>Final Score:</b>
            ${a} - ${b}
        </p>

        <p>
            <b>Winner:</b>
            ${winner}
        </p>

        <hr>

        <h3>${m.teamA.name}</h3>

        <ul>
            ${renderPlayers(m.teamA)}
        </ul>

        <h3>${m.teamB.name}</h3>

        <ul>
            ${renderPlayers(m.teamB)}
        </ul>

        <hr>

        <h3>End-by-End Scores</h3>

        ${endsHTML}

        <hr>

        <h3>Match Notes</h3>

        <p>
            ${m.notes || "No notes added."}
        </p>
    `;

    matchModal.style.display = "block";
}

/* ================= CLOSE MODAL ================= */

function closeModal() {

    matchModal.style.display = "none";
}

/* ================= CAPITALIZE ================= */

function capitalize(text) {

    return text.charAt(0).toUpperCase() +
           text.slice(1);
}

/* ================= LOAD MATCH ================= */

function loadMatch(id) {

    const m =
        matches.find(
            x => String(x.id) === String(id)
        );

    if (!m) {

        alert("Match not found.");

        return;
    }

    editingId.value = m.id;

    date.value = m.date || "";

    teamA.value = m.teamA.name || "";
    teamB.value = m.teamB.name || "";

    teamFormat.value = m.format || "fours";

    updatePlayerFields();

    Object.entries(m.teamA.players || {})
    .forEach(([role, value]) => {

        const input =
            document.getElementById(`a${role}`);

        if (input) input.value = value;
    });

    Object.entries(m.teamB.players || {})
    .forEach(([role, value]) => {

        const input =
            document.getElementById(`b${role}`);

        if (input) input.value = value;
    });

    notes.value = m.notes || "";

    endsTable.tBodies[0].innerHTML = "";

    m.ends.forEach(e => {

        addEnd(e.a, e.b);

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* ================= DELETE MATCH ================= */

function deleteMatch(id) {

    if (!confirm("Delete this match?")) {

        return;
    }

    matches =
        matches.filter(
            m => String(m.id) !== String(id)
        );

    saveStorage();

    render();
}

/* ================= CLEAR FORM ================= */

function clearForm() {

    editingId.value = "";

    date.value = "";

    teamA.value = "";
    teamB.value = "";

    notes.value = "";

    teamFormat.value = "fours";

    updatePlayerFields();

    endsTable.tBodies[0].innerHTML = "";

    addEnd();
}

/* ================= EXPORT JSON ================= */

function exportJSON() {

    const exportData = {

        version: 1,

        exported: new Date().toISOString(),

        matches
    };

    download(
        JSON.stringify(exportData, null, 2),
        "matches.json",
        "application/json"
    );
}

/* ================= EXPORT CSV ================= */

function exportCSV() {

    let csv =
        "Date,Format,TeamA,ScoreA,TeamB,ScoreB,Winner\n";

    matches.forEach(m => {

        const a = total(m, "a");

        const b = total(m, "b");

        let winner = "Draw";

        if (a > b) winner = m.teamA.name;
        else if (b > a) winner = m.teamB.name;

        csv +=
            `"${m.date}","${m.format}","${m.teamA.name}",${a},"${m.teamB.name}",${b},"${winner}"\n`;

    });

    download(csv, "matches.csv", "text/csv");
}

/* ================= IMPORT JSON ================= */

function importJSON(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        try {

            const parsed =
                JSON.parse(reader.result);

            const imported =
                parsed.matches || parsed;

            if (!Array.isArray(imported)) {

                alert("Invalid backup file.");

                return;
            }

            matches = imported.filter(m =>

                m &&
                m.teamA &&
                m.teamB &&
                Array.isArray(m.ends)

            );

            saveStorage();

            render();

            alert(
                `${matches.length} matches imported successfully.`
            );
        }

        catch (err) {

            console.error(err);

            alert(
                "Could not import JSON file."
            );
        }
    };

    reader.readAsText(file);
}

/* ================= CLEAR ALL ================= */

function clearAll() {

    if (
        !confirm(
            "Delete ALL saved matches?"
        )
    ) return;

    localStorage.removeItem("matches");

    matches = [];

    saveStorage();

    render();

    clearForm();
}

/* ================= DOWNLOAD ================= */

function download(data, name, type) {

    const blob =
        new Blob([data], { type });

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download = name;

    a.click();

    URL.revokeObjectURL(a.href);
}

/* ================= INITIALISE ================= */

updatePlayerFields();

clearForm();

render();

</script>

</body>
</html>
