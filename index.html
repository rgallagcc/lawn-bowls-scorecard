<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawn Bowls – Advanced Scorecard</title>
<style>

/* ================= THEMES ================= */

:root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #1f1f1f;
    --border: #d9d9d9;
    --accent: #2d6cdf;
    --shadow: rgba(0,0,0,0.08);
    --win: #d4edda;
    --loss: #f8d7da;
    --draw: #fff3cd;
}

[data-theme="dark"] {
    --bg: #121212;
    --card: #1f1f1f;
    --text: #f1f1f1;
    --border: #444;
    --accent: #4d8eff;
    --shadow: rgba(0,0,0,0.35);
    --win: #21492d;
    --loss: #552028;
    --draw: #5b4d17;
}

[data-theme="paper"] {
    --bg: #f5ecd9;
    --card: #fffaf1;
    --text: #4a3622;
    --border: #c9b89d;
    --accent: #8b5a2b;
    --shadow: rgba(80,50,20,0.1);
    --win: #d8ead2;
    --loss: #efd0d0;
    --draw: #f7edc9;
}

[data-theme="cyberpunk"] {
    --bg: #0b0220;
    --card: #16003a;
    --text: #f5f500;
    --border: #ff00ff;
    --accent: #00f7ff;
    --shadow: rgba(255,0,255,0.35);
    --win: #003d20;
    --loss: #4b001d;
    --draw: #544600;
}

/* ================= BASE ================= */

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 12px 12px 80px;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s, color 0.25s;
}

.container { max-width: 1200px; margin: auto; }

h1, h2, h3 { margin-top: 0; }

/* ================= TOPBAR ================= */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

/* ================= CARD ================= */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 12px var(--shadow);
}

/* ================= GRID ================= */

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* ================= FORMS ================= */

label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
}

input, textarea, select {
    width: 100%;
    margin-top: 4px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
}

textarea { resize: vertical; }

/* ================= BUTTONS ================= */

button {
    border: none;
    background: var(--accent);
    color: white;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
    transition: opacity 0.2s, transform 0.2s;
}

button:hover { opacity: 0.9; transform: translateY(-1px); }

.btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover { background: #a93226; }

/* ================= TABLES (history only) ================= */

.table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table { width: 100%; border-collapse: collapse; }

.desktop-history table { min-width: 600px; }

th, td {
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
}

th { background: rgba(255,255,255,0.05); }

.actions button {
    margin: 2px;
    padding: 8px 10px;
    width: auto;
    margin-top: 0;
}

.notice { padding: 16px; text-align: center; }

.win  { background: var(--win);  }
.loss { background: var(--loss); }
.draw { background: var(--draw); }

/* ================= ENDS (quick score) ================= */

/* Column label row above ends */
.ends-header {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    font-weight: 700;
    font-size: 0.85rem;
    opacity: 0.6;
    padding: 4px 8px;
    text-align: center;
}

/* List of end rows */
.ends-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 6px;
}

/* Single end row */
.end-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
}

.end-num {
    font-weight: bold;
    font-size: 0.9rem;
    text-align: center;
    opacity: 0.65;
}

/* − N + controls */
.quick-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.q-btn {
    width: 36px;
    height: 36px;
    min-width: 36px;
    padding: 0;
    font-size: 1.25rem;
    line-height: 1;
    border-radius: 8px;
    margin-top: 0;
    flex-shrink: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: bold;
}

.q-score {
    min-width: 28px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: bold;
}

.remove-end-btn {
    width: 36px;
    height: 36px;
    min-width: 36px;
    padding: 0;
    font-size: 1rem;
    border-radius: 8px;
    margin-top: 0;
    background: #c0392b;
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Totals bar */
.ends-totals {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    padding: 8px 8px;
    border-top: 2px solid var(--border);
    margin-top: 4px;
}

.ends-totals .label {
    font-size: 0.8rem;
    font-weight: bold;
    opacity: 0.55;
    text-align: center;
}

.total-score {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    transition: color 0.2s;
}

.total-winning { color: #1a7a3a; }
.total-losing  { color: #b03030; }

[data-theme="dark"] .total-winning { color: #5dbb6f; }
[data-theme="dark"] .total-losing  { color: #e07070; }

/* ================= MATCH HISTORY MOBILE CARDS ================= */

.desktop-history { display: block; }
.mobile-history  { display: none;  }

.match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px var(--shadow);
}

.match-card.win  { background: var(--win);  }
.match-card.loss { background: var(--loss); }
.match-card.draw { background: var(--draw); }

.match-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    opacity: 0.85;
}

.match-score {
    font-size: 1.2rem;
    font-weight: bold;
    margin: 10px 0;
}

.match-meta {
    margin-top: 8px;
    font-size: 0.92rem;
    line-height: 1.6;
}

.match-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.match-actions button { flex: 1; margin-top: 0; }

/* ================= STATISTICS ================= */

.stats-perspective {
    font-size: 0.82rem;
    opacity: 0.65;
    margin-bottom: 8px;
}

/* ================= MODALS ================= */

#matchModal,
#confirmModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    overflow: auto;
    padding: 12px;
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

#matchModal { align-items: flex-start; }

.modal-box {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    position: relative;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: auto !important;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 1rem;
    line-height: 1;
    margin-top: 0;
}

.confirm-box { max-width: 340px; text-align: center; padding: 28px 24px; }
.confirm-box p { font-size: 1rem; margin-bottom: 20px; }

.confirm-actions { display: flex; gap: 10px; justify-content: center; }
.confirm-actions button { width: auto; padding: 8px 22px; }

/* ================= STICKY EXPORT BAR ================= */

.sticky-export {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 10px var(--shadow);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 500;
}

.sticky-export-actions { display: flex; gap: 8px; flex-shrink: 0; }

.sticky-export-actions button {
    width: auto;
    padding: 7px 14px;
    font-size: 0.85rem;
    margin-top: 0;
}

.export-reminder {
    font-size: 0.82rem;
    color: var(--text);
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.export-reminder.overdue { color: #c0392b; opacity: 1; font-weight: bold; }

/* ================= MOBILE ================= */

@media (max-width: 768px) {

    .grid-2 { grid-template-columns: 1fr; }

    body { padding: 8px 8px 80px; }

    .card { padding: 12px; border-radius: 12px; }

    button { width: 100%; }

    /* Exceptions — must stay compact */
    .actions button,
    .match-actions button,
    .confirm-actions button,
    .close-btn,
    .remove-end-btn,
    .q-btn,
    .sticky-export-actions button {
        width: auto;
    }

    h1 { font-size: 1.5rem; }

    .desktop-history { display: none;  }
    .mobile-history  { display: block; }
}

</style>
</head>
<body>

<div class="container">

<!-- ================= TOPBAR ================= -->

<div class="topbar">
    <h1>🏏 Lawn Bowls – Advanced Scorecard</h1>
    <select id="themeSelector" onchange="changeTheme()">
        <option value="light">Light Mode</option>
        <option value="dark">Dark Mode</option>
        <option value="paper">Paper</option>
        <option value="cyberpunk">Cyberpunk</option>
    </select>
</div>

<!-- ================= ADD / EDIT ================= -->

<div class="card">
    <h2>Add / Edit Match</h2>
    <input type="hidden" id="editingId">

    <div class="grid-2">
        <div>
            <label>Date <input type="date" id="date"></label>
        </div>
        <div>
            <label>Team Format / Size
                <select id="teamFormat" onchange="updatePlayerFields()">
                    <option value="singles" selected>Singles</option>
                    <option value="pairs">Pairs</option>
                    <option value="triples">Triples</option>
                    <option value="fours">Fours / Rinks</option>
                </select>
            </label>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <h3>Team A</h3>
            <label>Team Name <input id="teamA"></label>
            <div id="teamAPlayers"></div>
        </div>
        <div>
            <h3>Team B</h3>
            <label>Team Name <input id="teamB"></label>
            <div id="teamBPlayers"></div>
        </div>
    </div>

    <h3>Ends</h3>

    <!-- Column labels — update live with team names -->
    <div class="ends-header">
        <span>#</span>
        <span id="endsLabelA">Team A</span>
        <span id="endsLabelB">Team B</span>
        <span></span>
    </div>

    <!-- End rows rendered here -->
    <div class="ends-list" id="endsList"></div>

    <!-- Running totals -->
    <div class="ends-totals">
        <span class="label">Total</span>
        <span class="total-score" id="totalA">0</span>
        <span class="total-score" id="totalB">0</span>
        <span></span>
    </div>

    <button onclick="addEnd()">+ Add End</button>

    <label>Match Notes <textarea id="notes" rows="4"></textarea></label>

    <button onclick="saveMatch()">Save Match</button>
</div>

<!-- ================= FILTERS ================= -->

<div class="card">
    <h2>Filters</h2>
    <div class="grid-2">
        <div>
            <label>Filter by Team <input id="filterTeam" oninput="render()"></label>
        </div>
        <div>
            <label>From Date <input type="date" id="fromDate" onchange="render()"></label>
            <label>To Date   <input type="date" id="toDate"   onchange="render()"></label>
        </div>
    </div>
</div>

<!-- ================= MATCH HISTORY ================= -->

<div class="card">
    <h2>Match History</h2>

    <div class="desktop-history">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th><th>Team A</th><th>Score</th>
                        <th>Team B</th><th>Score</th><th>Winner</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="matchHistory"></tbody>
            </table>
        </div>
    </div>

    <div id="mobileMatchCards" class="mobile-history"></div>
</div>

<!-- ================= STATISTICS ================= -->

<div class="card">
    <h2>Statistics</h2>
    <div id="statsPerspective" class="stats-perspective"></div>
    <div id="stats"></div>
</div>

<!-- ================= IMPORT / EXPORT ================= -->

<div class="card">
    <h2>Import / Export</h2>
    <div class="grid-2">
        <div>
            <button onclick="exportJSON()">⬇ Export JSON</button>
            <button onclick="exportCSV()">⬇ Export CSV</button>
        </div>
        <div>
            <input type="file" accept=".json" onchange="importJSON(event)">
            <button onclick="clearAll()">🗑 Clear All</button>
        </div>
    </div>
    <p id="lastSaved"></p>
</div>

</div><!-- /.container -->

<!-- ================= MATCH DETAIL MODAL ================= -->

<div id="matchModal">
    <div class="modal-box">
        <button class="close-btn btn-secondary" onclick="closeModal()">✖ Close</button>
        <div id="modalContent"></div>
    </div>
</div>

<!-- ================= CONFIRM DELETE MODAL ================= -->

<div id="confirmModal">
    <div class="modal-box confirm-box">
        <p id="confirmMessage">Are you sure?</p>
        <div class="confirm-actions">
            <button class="btn-danger" id="confirmYes">🗑 Delete</button>
            <button class="btn-secondary" onclick="closeConfirm()">Cancel</button>
        </div>
    </div>
</div>

<!-- ================= STICKY EXPORT BAR ================= -->

<div class="sticky-export">
    <span id="exportReminder" class="export-reminder">Checking…</span>
    <div class="sticky-export-actions">
        <button onclick="exportJSON()">⬇ JSON</button>
        <button onclick="exportCSV()">⬇ CSV</button>
    </div>
</div>

<script>

/* ================= THEME ================= */

function changeTheme() {
    const t = themeSelector.value;
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("theme", t);
}

(function loadTheme() {
    const t = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", t);
    themeSelector.value = t;
})();

/* ================= STORAGE ================= */

let matches = [];

(function loadStorage() {
    try {
        const saved = JSON.parse(localStorage.getItem("matches"));
        if (Array.isArray(saved)) matches = saved;
    } catch (e) { matches = []; }
})();

function saveStorage() {
    try {
        localStorage.setItem("matches", JSON.stringify(matches));
        lastSaved.textContent = "Last saved: " + new Date().toLocaleString();
    } catch (e) {
        alert("⚠ Save failed — storage may be full. Please export your data.");
    }
}

/* ================= PLAYER FIELDS ================= */

const ROLES = {
    singles: ["Single"],
    pairs:   ["Lead", "Skip"],
    triples: ["Lead", "Second", "Skip"],
    fours:   ["Lead", "Second", "Third", "Skip"]
};

function updatePlayerFields() {
    const roles = ROLES[teamFormat.value] || ROLES.fours;
    renderPlayerInputs("teamAPlayers", "a", roles);
    renderPlayerInputs("teamBPlayers", "b", roles);
    syncEndsLabels();
}

function renderPlayerInputs(containerId, prefix, roles) {
    document.getElementById(containerId).innerHTML = roles
        .map(r => `<label>${r}<input id="${prefix}${r.toLowerCase()}"></label>`)
        .join("");
}

function getPlayers(prefix) {
    const out = {};
    document.querySelectorAll(`#team${prefix.toUpperCase()}Players input`)
        .forEach(inp => { out[inp.id.replace(prefix, "")] = inp.value.trim(); });
    return out;
}

function syncEndsLabels() {
    document.getElementById("endsLabelA").textContent = teamA.value.trim() || "Team A";
    document.getElementById("endsLabelB").textContent = teamB.value.trim() || "Team B";
}

teamA.addEventListener("input", syncEndsLabels);
teamB.addEventListener("input", syncEndsLabels);

/* ================= QUICK SCORE ENDS ================= */

function addEnd(a = 0, b = 0) {
    const list = document.getElementById("endsList");
    const num  = list.children.length + 1;
    const row  = document.createElement("div");
    row.className   = "end-row";
    row.dataset.end = num;
    row.innerHTML = `
        <div class="end-num">${num}</div>
        <div class="quick-cell">
            <button class="q-btn" onclick="adjust(this,-1)" type="button">−</button>
            <span class="q-score">${a}</span>
            <button class="q-btn" onclick="adjust(this,1)"  type="button">+</button>
        </div>
        <div class="quick-cell">
            <button class="q-btn" onclick="adjust(this,-1)" type="button">−</button>
            <span class="q-score">${b}</span>
            <button class="q-btn" onclick="adjust(this,1)"  type="button">+</button>
        </div>
        <button class="remove-end-btn" onclick="removeEnd(this)" type="button">✕</button>`;
    list.appendChild(row);
    updateTotals();
}

function adjust(btn, delta) {
    const span = btn.parentElement.querySelector(".q-score");
    span.textContent = Math.max(0, Number(span.textContent) + delta);
    updateTotals();
}

function removeEnd(btn) {
    btn.closest(".end-row").remove();
    renumberEnds();
    updateTotals();
}

function renumberEnds() {
    document.querySelectorAll("#endsList .end-row").forEach((row, i) => {
        row.dataset.end = i + 1;
        row.querySelector(".end-num").textContent = i + 1;
    });
}

function updateTotals() {
    let sumA = 0, sumB = 0;
    document.querySelectorAll("#endsList .end-row").forEach(row => {
        const s = row.querySelectorAll(".q-score");
        sumA += Number(s[0].textContent);
        sumB += Number(s[1].textContent);
    });

    const elA = document.getElementById("totalA");
    const elB = document.getElementById("totalB");
    elA.textContent = sumA;
    elB.textContent = sumB;
    elA.className = "total-score" + (sumA > sumB ? " total-winning" : sumA < sumB ? " total-losing" : "");
    elB.className = "total-score" + (sumB > sumA ? " total-winning" : sumB < sumA ? " total-losing" : "");
}

function getEndsData() {
    return [...document.querySelectorAll("#endsList .end-row")].map(row => {
        const s = row.querySelectorAll(".q-score");
        return { a: Number(s[0].textContent), b: Number(s[1].textContent) };
    });
}

/* ================= MATCH TOTALS (history) ================= */

function total(match, side) {
    if (!match.ends || !Array.isArray(match.ends)) return 0;
    return match.ends.reduce((sum, e) => sum + Number(e[side] || 0), 0);
}

/* ================= SAVE MATCH ================= */

function saveMatch() {
    if (!date.value || !teamA.value.trim() || !teamB.value.trim()) {
        alert("Please enter a date and both team names.");
        return;
    }
    const ends = getEndsData();
    if (ends.length === 0) { alert("Please add at least one end."); return; }

    const id    = editingId.value || Date.now().toString();
    const match = {
        id,
        date:    date.value,
        format:  teamFormat.value,
        teamA:   { name: teamA.value.trim(), players: getPlayers("a") },
        teamB:   { name: teamB.value.trim(), players: getPlayers("b") },
        ends,
        notes:   notes.value.trim(),
        created: new Date().toISOString()
    };

    matches = matches.filter(m => String(m.id) !== String(id));
    matches.push(match);
    matches.sort((a, b) => new Date(b.date) - new Date(a.date));

    saveStorage();
    clearForm();
    render();
}

/* ================= CLEAR FORM ================= */

function clearForm() {
    editingId.value  = "";
    date.value       = "";
    teamA.value      = "";
    teamB.value      = "";
    notes.value      = "";
    teamFormat.value = "singles";
    updatePlayerFields();
    document.getElementById("endsList").innerHTML = "";
    updateTotals();
    addEnd();
}

/* ================= RENDER ================= */

function render() {
    const tbody    = document.getElementById("matchHistory");
    const cards    = document.getElementById("mobileMatchCards");
    const perspEl  = document.getElementById("statsPerspective");

    tbody.innerHTML = "";
    cards.innerHTML = "";

    let rows = 0, wins = 0, losses = 0, draws = 0, shotsFor = 0, shotsAgainst = 0;
    const tf = (filterTeam.value || "").toLowerCase().trim();

    matches.forEach(m => {
        if (!m || !m.teamA || !m.teamB || !Array.isArray(m.ends)) return;

        const nA = m.teamA.name || "Unknown";
        const nB = m.teamB.name || "Unknown";

        if (tf && !nA.toLowerCase().includes(tf) && !nB.toLowerCase().includes(tf)) return;
        if (fromDate.value && new Date(m.date) < new Date(fromDate.value)) return;
        if (toDate.value   && new Date(m.date) > new Date(toDate.value))   return;

        const a = total(m, "a");
        const b = total(m, "b");

        const hitA  = !tf || nA.toLowerCase().includes(tf);
        const hitB  = !tf || nB.toLowerCase().includes(tf);
        const fromB = !hitA && hitB;

        shotsFor     += fromB ? b : a;
        shotsAgainst += fromB ? a : b;

        let winner = "Draw", cls = "draw";
        if (a > b)      { winner = nA; cls = fromB ? "loss" : "win"; fromB ? losses++ : wins++; }
        else if (b > a) { winner = nB; cls = fromB ? "win" : "loss"; fromB ? wins++ : losses++; }
        else            { draws++; }

        /* Desktop */
        const tr = document.createElement("tr");
        tr.className = cls;
        tr.innerHTML = `
            <td>${m.date||"-"}</td><td>${nA}</td><td>${a}</td>
            <td>${nB}</td><td>${b}</td><td>${winner}</td>
            <td class="actions">
                <button onclick="viewMatch('${m.id}')">👁</button>
                <button onclick="loadMatch('${m.id}')">✏</button>
                <button onclick="deleteMatch('${m.id}')">🗑</button>
            </td>`;
        tbody.appendChild(tr);

        /* Mobile card */
        const card = document.createElement("div");
        card.className = `match-card ${cls}`;
        card.innerHTML = `
            <div class="match-card-header">
                <div>📅 ${m.date||"-"}</div>
                <div>${capitalize(m.format||"singles")}</div>
            </div>
            <div class="match-score">${nA} ${a} – ${b} ${nB}</div>
            <div class="match-meta">
                <b>Winner:</b> ${winner}<br>
                <b>Ends:</b> ${m.ends.length}<br>
                <b>Notes:</b> ${m.notes ? m.notes.substring(0,60)+(m.notes.length>60?"…":"") : "None"}
            </div>
            <div class="match-actions">
                <button onclick="viewMatch('${m.id}')">View</button>
                <button onclick="loadMatch('${m.id}')">Edit</button>
                <button onclick="deleteMatch('${m.id}')">Delete</button>
            </div>`;
        cards.appendChild(card);
        rows++;
    });

    if (rows === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="notice">No matches match the current filters.</td></tr>`;
        cards.innerHTML = `<div class="notice">No matches match the current filters.</div>`;
    }

    /* Perspective label */
    let lbl = "Showing stats from Team A's perspective (default)";
    if (tf) {
        const s = matches.find(m => m && m.teamA && m.teamB &&
            ((m.teamA.name||"").toLowerCase().includes(tf) || (m.teamB.name||"").toLowerCase().includes(tf)));
        if (s) {
            const aH = (s.teamA.name||"").toLowerCase().includes(tf);
            const bH = (s.teamB.name||"").toLowerCase().includes(tf);
            lbl = (bH && !aH)
                ? `Showing stats from "${filterTeam.value}" (Team B) perspective`
                : `Showing stats for "${filterTeam.value}"`;
        }
    }
    perspEl.textContent = lbl;

    document.getElementById("stats").innerHTML = `
        <b>Results</b><br>Wins: ${wins} | Losses: ${losses} | Draws: ${draws}
        <br><br>
        <b>Shots</b><br>Shots For: ${shotsFor} | Shots Against: ${shotsAgainst} | Difference: ${shotsFor - shotsAgainst}
        <br><br>
        <b>Total Matches:</b> ${rows}`;
}

/* ================= VIEW MATCH ================= */

function viewMatch(id) {
    const m = matches.find(x => String(x.id) === String(id));
    if (!m) return;

    const a = total(m,"a"), b = total(m,"b");
    const winner = a>b ? m.teamA.name : b>a ? m.teamB.name : "Draw";

    const pList = t => Object.entries(t.players||{})
        .map(([r,n]) => `<li><b>${capitalize(r)}:</b> ${n||"-"}</li>`).join("");

    const eRows = m.ends.map((e,i) =>
        `<tr><td>${i+1}</td><td>${e.a}</td><td>${e.b}</td></tr>`).join("");

    modalContent.innerHTML = `
        <h2>${m.teamA.name} vs ${m.teamB.name}</h2>
        <p><b>Date:</b> ${m.date}</p>
        <p><b>Format:</b> ${capitalize(m.format)}</p>
        <p><b>Final Score:</b> ${a} – ${b}</p>
        <p><b>Winner:</b> ${winner}</p>
        <hr>
        <h3>${m.teamA.name}</h3><ul>${pList(m.teamA)}</ul>
        <h3>${m.teamB.name}</h3><ul>${pList(m.teamB)}</ul>
        <hr>
        <h3>End-by-End Scores</h3>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>End</th><th>${m.teamA.name}</th><th>${m.teamB.name}</th></tr></thead>
                <tbody>${eRows}</tbody>
            </table>
        </div>
        <hr>
        <h3>Match Notes</h3>
        <p>${m.notes || "No notes added."}</p>`;

    matchModal.style.display = "flex";
}

function closeModal() { matchModal.style.display = "none"; }

/* ================= LOAD MATCH ================= */

function loadMatch(id) {
    const m = matches.find(x => String(x.id) === String(id));
    if (!m) { alert("Match not found."); return; }

    editingId.value  = m.id;
    date.value       = m.date || "";
    teamA.value      = m.teamA.name || "";
    teamB.value      = m.teamB.name || "";
    teamFormat.value = m.format || "singles";
    notes.value      = m.notes || "";

    updatePlayerFields();

    Object.entries(m.teamA.players||{}).forEach(([r,v]) => {
        const el = document.getElementById(`a${r}`); if (el) el.value = v;
    });
    Object.entries(m.teamB.players||{}).forEach(([r,v]) => {
        const el = document.getElementById(`b${r}`); if (el) el.value = v;
    });

    document.getElementById("endsList").innerHTML = "";
    m.ends.forEach(e => addEnd(e.a, e.b));
    syncEndsLabels();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= DELETE MATCH ================= */

let pendingDeleteId = null;

function deleteMatch(id) {
    const m = matches.find(x => String(x.id) === String(id));
    if (!m) return;
    document.getElementById("confirmMessage").textContent =
        `Delete this match?\n${m.teamA?.name||"Team A"} vs ${m.teamB?.name||"Team B"} (${m.date||"no date"})`;
    pendingDeleteId = id;
    confirmModal.style.display = "flex";
    document.getElementById("confirmYes").onclick = () => {
        matches = matches.filter(x => String(x.id) !== String(pendingDeleteId));
        saveStorage();
        render();
        closeConfirm();
    };
}

function closeConfirm() {
    confirmModal.style.display = "none";
    pendingDeleteId = null;
}

/* ================= CAPITALIZE ================= */

function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
}

/* ================= EXPORT REMINDER ================= */

function updateExportReminder() {
    const last = localStorage.getItem("lastExported");
    const el   = document.getElementById("exportReminder");
    if (!last) {
        el.textContent = "⚠ Never exported — back up your data!";
        el.className   = "export-reminder overdue";
        return;
    }
    const days = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
    if (days === 0)      { el.textContent = "✓ Exported today";                                           el.className = "export-reminder"; }
    else if (days <= 7)  { el.textContent = `✓ Last exported ${days} day${days>1?"s":""} ago`;           el.className = "export-reminder"; }
    else                 { el.textContent = `⚠ Last exported ${days} days ago — consider a backup!`;     el.className = "export-reminder overdue"; }
}

function recordExport() {
    localStorage.setItem("lastExported", new Date().toISOString());
    updateExportReminder();
}

/* ================= EXPORT JSON ================= */

function exportJSON() {
    download(
        JSON.stringify({ version:1, exported: new Date().toISOString(), matches }, null, 2),
        "matches.json", "application/json"
    );
    recordExport();
}

/* ================= EXPORT CSV ================= */

function exportCSV() {
    let csv = "Date,Format,TeamA,ScoreA,TeamB,ScoreB,Winner\n";
    matches.forEach(m => {
        const a = total(m,"a"), b = total(m,"b");
        const w = a>b ? m.teamA.name : b>a ? m.teamB.name : "Draw";
        csv += `"${m.date}","${m.format}","${m.teamA.name}",${a},"${m.teamB.name}",${b},"${w}"\n`;
    });
    download(csv, "matches.csv", "text/csv");
    recordExport();
}

/* ================= IMPORT JSON ================= */

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const parsed   = JSON.parse(reader.result);
            const imported = parsed.matches || parsed;
            if (!Array.isArray(imported)) { alert("Invalid backup file."); return; }
            matches = imported.filter(m => m && m.teamA && m.teamB && Array.isArray(m.ends));
            saveStorage();
            render();
            alert(`${matches.length} matches imported successfully.`);
        } catch (e) { alert("Could not import JSON file."); }
    };
    reader.readAsText(file);
}

/* ================= CLEAR ALL ================= */

function clearAll() {
    if (!confirm("Delete ALL saved matches?")) return;
    localStorage.removeItem("matches");
    matches = [];
    saveStorage();
    render();
    clearForm();
}

/* ================= DOWNLOAD HELPER ================= */

function download(data, name, type) {
    const a   = document.createElement("a");
    a.href     = URL.createObjectURL(new Blob([data], { type }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
}

/* ================= INIT ================= */

updatePlayerFields();
clearForm();
render();
updateExportReminder();

</script>
</body>
</html>
